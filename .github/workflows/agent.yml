name: Agent NI3 AI Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  agent-job:
    if: startsWith(github.event.comment.body, '[agent-ni3]') || contains(github.event.comment.body, 'create PR')
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Authenticate as GitHub App
      - name: Authenticate as GitHub App
        id: auth
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}
          installation_id: ${{ secrets.INSTALLATION_ID }}

      # 3. Extract prompt & detect branch
      - name: Parse Prompt & Branch
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if [[ "$COMMENT" == create\ PR* ]]; then
            echo "CREATE_PR=yes" >> $GITHUB_ENV
          else
            echo "CREATE_PR=no" >> $GITHUB_ENV
          fi

          if [[ "$COMMENT" == [agent-ni3]* ]]; then
            PROMPT="${COMMENT#"[agent-ni3]"}"
            echo "PROMPT=$PROMPT" >> $GITHUB_ENV

            # Detect branch in prompt
            if [[ "$PROMPT" =~ branch[:=]\ *([a-zA-Z0-9_\-/]+) ]]; then
              BASE_BRANCH="${BASH_REMATCH[1]}"
              echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
            else
              curl -s -X POST \
                -H "Authorization: token ${{ steps.auth.outputs.token }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
                -d '{"body": "⚠️ No branch specified. Reply with `branch:<branch-name>` to proceed."}'
              exit 1
            fi
          fi

      # 4. Post in-progress comment
      - name: Post "in progress" comment
        if: env.CREATE_PR == 'no'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ steps.auth.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d '{"body": "⏳ Agent NI3 is processing your prompt on branch '"${BASE_BRANCH}"'..."}'

      # 5. Apply AI-assisted changes
      - name: Generate Code using AI
        if: env.CREATE_PR == 'no'
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git fetch origin $BASE_BRANCH
          TEMP_BRANCH="agent-ni3-fix-$(date +%s)"
          git checkout -b $TEMP_BRANCH origin/$BASE_BRANCH

          # Use AI to generate code
          PROMPT="${{ env.PROMPT }}"
          GENERATED_CODE=$(curl -s https://api.openai.com/v1/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "text-davinci-003",
              "prompt": "Generate the necessary code/files for the following instruction: '"$PROMPT"' in the NikRa repo. Include file paths and code content only.",
              "max_tokens": 1000
            }' | jq -r '.choices[0].text')

          # Save generated code to a temporary file (example: agent_output.txt)
          echo "$GENERATED_CODE" > agent_output.txt

          # Optional: parse AI output to create/modify files
          # For simplicity, just commit the AI output for now
          git add agent_output.txt
          git commit -m "Agent NI3 AI-generated changes"
          git push origin $TEMP_BRANCH

          echo "TEMP_BRANCH=$TEMP_BRANCH" >> $GITHUB_ENV
          echo "CHANGES_MADE=Yes" >> $GITHUB_ENV
          echo "AI_OUTPUT=$GENERATED_CODE" >> $GITHUB_ENV

      # 6. Post AI result comment
      - name: Post AI result comment
        if: env.CREATE_PR == 'no' && env.CHANGES_MADE == 'Yes'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ steps.auth.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d '{"body": "✅ Agent NI3 has applied AI-generated changes on branch '"${TEMP_BRANCH}"'.\n\nOutput preview:\n'"${{ env.AI_OUTPUT }}"'\n\nTo create a PR, reply `create PR`."}'

      # 7. Create PR (same as before)
      - name: Create PR
        if: env.CREATE_PR == 'yes'
        run: |
          TEMP_BRANCH=$(git branch -r | grep agent-ni3-fix | tail -1 | sed 's/origin\///')
          PR_TITLE="Agent NI3 AI: Automated changes"
          PR_BODY="AI-generated PR by Agent NI3 bot based on user prompt."

          PR_NUMBER=$(curl -s -X POST \
            -H "Authorization: token ${{ steps.auth.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d '{"title":"'"$PR_TITLE"'","head":"'"$TEMP_BRANCH"'","base":"main","body":"'"$PR_BODY"'"}' | jq -r '.number')

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

          curl -s -X POST \
            -H "Authorization: token ${{ steps.auth.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers \
            -d '{"reviewers":["ni3-sharma"]}'

          curl -s -X POST \
            -H "Authorization: token ${{ steps.auth.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d '{"body":"✅ PR #'"$PR_NUMBER"' created with AI-generated changes from branch '"$TEMP_BRANCH"'."}'
