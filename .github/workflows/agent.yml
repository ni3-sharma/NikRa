name: Agent NI3 AI Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  agent-main:
    if: startsWith(github.event.comment.body, '[agent-ni3]')
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout main branch
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Authenticate GitHub App
      - name: Authenticate GitHub App
        id: auth
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}
          installation_id: ${{ secrets.INSTALLATION_ID }}

      # 3. Parse comment
      - name: Parse Comment
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          # Robustly capture everything after [agent-ni3]
          if [[ "$COMMENT" =~ \[agent-ni3\](.*) ]]; then
              PROMPT="${BASH_REMATCH[1]}"
              PROMPT=$(echo "$PROMPT" | sed 's/^[[:space:]\n]*//;s/[[:space:]\n]*$//')
          else
              PROMPT=""
          fi

          if [ -z "$PROMPT" ]; then
              curl -s -X POST \
                -H "Authorization: token ${{ steps.auth.outputs.token }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
                -d '{"body":"❌ No valid prompt detected. Please start your comment with `[agent-ni3]` followed by instructions."}'
              exit 1
          fi

          echo "PROMPT=$PROMPT" >> $GITHUB_ENV

      # 4. Post in-progress comment
      - name: Post in-progress comment
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ steps.auth.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d '{"body":"⏳ Agent NI3 is processing your prompt on the main branch..."}'

      # 5. AI Code Generation
      - name: AI Code Generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e

          # Safe JSON escaping for prompt
          PROMPT_JSON=$(jq -Rn --arg p "$PROMPT" '$p')

          # Call OpenAI API
          AI_OUTPUT=$(curl -s https://api.openai.com/v1/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "text-davinci-003",
              "prompt": '"$PROMPT_JSON"',
              "max_tokens": 2000,
              "temperature": 0
            }' | jq -r '.choices[0].text // "⚠️ AI returned empty output"')

          echo "$AI_OUTPUT" > agent_ai_output.txt
          echo "AI_OUTPUT=$AI_OUTPUT" >> $GITHUB_ENV

          # Multi-file parsing: file:<filename> content:| <content>
          awk '
            /^file:/ { file=$2; next }
            /^content: \|/ { content=""; in_content=1; next }
            { if(in_content) { content=content $0 "\n" } }
            /^$/ { if(file != "") { 
                      system("mkdir -p \"$(dirname \""file"\")\" && echo \"" content "\" > \""file"\"") 
                      file=""; in_content=0 
                    } 
            }
          ' agent_ai_output.txt || echo "⚠️ Some AI output could not be parsed; check agent_ai_output.txt"

          # Commit changes to main
          git config user.name "Agent NI3 Bot"
          git config user.email "agent-ni3-bot@github.com"
          git add .
          git commit -m "Agent NI3 AI-generated files" || echo "No changes to commit"
          git push origin main || echo "⚠️ Push failed"

      # 6. Post AI result
      - name: Post AI result
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ steps.auth.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d '{"body": "✅ Agent NI3 applied AI-generated files on the main branch.\n\nPreview:\n'"${{ env.AI_OUTPUT }}"'"}'
