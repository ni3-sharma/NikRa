name: Agent NI3 Copilot Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  agent-ni3:
    if: startsWith(github.event.comment.body, '[agent-ni3]')
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout main branch
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2️⃣ Install GitHub Copilot CLI
      - name: Install Copilot CLI
        run: npm install -g @githubnext/github-copilot-cli

      # 3️⃣ Authenticate Copilot CLI
      - name: Authenticate Copilot CLI
        run: copilot auth login --with-token ${{ secrets.GITHUB_TOKEN }}

      # 4️⃣ Parse issue comment for prompt
      - name: Parse Comment
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          if [[ "$COMMENT" =~ \[agent-ni3\](.*) ]]; then
              PROMPT="${BASH_REMATCH[1]}"
              PROMPT=$(echo "$PROMPT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          else
              PROMPT=""
          fi

          if [ -z "$PROMPT" ]; then
              curl -s -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
                -d '{"body":"❌ No valid prompt detected. Please start your comment with `[agent-ni3]` followed by instructions."}'
              exit 1
          fi

          echo "PROMPT=$PROMPT" >> $GITHUB_ENV

      # 5️⃣ Post in-progress comment
      - name: Post in-progress comment
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d '{"body":"⏳ Agent NI3 is processing your prompt on the main branch..."}'

      # 6️⃣ Generate code using Copilot
      - name: Copilot Generate Code
        run: |
          PROMPT="${{ env.PROMPT }}"
          copilot generate --prompt "$PROMPT" > agent_output.txt
          cat agent_output.txt

      # 7️⃣ Parse multi-file output and create files
      - name: Parse AI output to files
        run: |
          awk '
            /^file:/ { file=$2; next }
            /^content: \|/ { content=""; in_content=1; next }
            { if(in_content) { content=content $0 "\n" } }
            /^$/ { if(file != "") { 
                      system("mkdir -p \"$(dirname \""file"\")\" && echo \"" content "\" > \""file"\"") 
                      file=""; in_content=0 
                    } 
            }
          ' agent_output.txt || echo "⚠️ Some AI output could not be parsed; check agent_output.txt"

      # 8️⃣ Commit and push changes to main
      - name: Commit changes
        run: |
          git config user.name "Agent NI3 Bot"
          git config user.email "agent-ni3-bot@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Agent NI3 Copilot-generated files"
          git push origin main || echo "⚠️ Push failed; possibly no changes"

      # 9️⃣ Post preview and result in the issue
      - name: Post result
        run: |
          AI_PREVIEW=$(cat agent_output.txt | head -n 50)
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d '{"body": "✅ Agent NI3 applied Copilot-generated files on the main branch.\n\nPreview (first 50 lines):\n'"$AI_PREVIEW"'"}'
