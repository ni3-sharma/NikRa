- name: Parse Comment (robust)
  id: parse
  run: |
    COMMENT="${{ github.event.comment.body }}"
    ISSUE_NUMBER="${{ github.event.issue.number }}"

    CREATE_PR="no"
    if [[ "$COMMENT" =~ [Cc]reate[[:space:]]PR ]]; then
        CREATE_PR="yes"
    fi
    echo "CREATE_PR=$CREATE_PR" >> $GITHUB_ENV

    # Robustly extract [agent-ni3] content
    if [[ "$COMMENT" =~ \[agent-ni3\](.*) ]]; then
        PROMPT="${BASH_REMATCH[1]}"
        PROMPT=$(echo "$PROMPT" | sed 's/^[[:space:]\n]*//;s/[[:space:]\n]*$//')  # trim spaces & newlines
    else
        PROMPT=""
    fi
    echo "PROMPT=$PROMPT" >> $GITHUB_ENV

    # Detect branch anywhere in the comment (branch:xxx)
    if [[ "$COMMENT" =~ [Bb]ranch[:=][[:space:]]*([a-zA-Z0-9_\-\/]+) ]]; then
        BASE_BRANCH="${BASH_REMATCH[1]}"
    else
        BASE_BRANCH=""
    fi
    echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
